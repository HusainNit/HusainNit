<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" width="260" height="40">
  <style>
    .watcher {
      font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans", sans-serif;
      font-size: 20px;
      font-weight: bold;
      fill: #8b949e;
      transform-box: fill-box;
      transform-origin: center;
      animation: wiggle 1.6s infinite ease-in-out;
    }
    .w1 { animation-delay: 0s; }
    .w2 { animation-delay: 0.2s; }
    .w3 { animation-delay: 0.4s; }
    .w4 { animation-delay: 0.6s; }

    @keyframes wiggle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25%      { transform: translateY(-4px) rotate(-8deg); }
      50%      { transform: translateY(0px) rotate(0deg); }
      75%      { transform: translateY(-4px) rotate(8deg); }
    }
  </style>

  <text x="15" y="27" class="watcher w1">༼∵༽</text>
  <text x="75" y="27" class="watcher w2">༼⍨༽</text>
  <text x="135" y="27" class="watcher w3">༼⍢༽</text>
  <text x="195" y="27" class="watcher w4">༼⍤༽</text>
</svg>